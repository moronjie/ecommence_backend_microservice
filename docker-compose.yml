name: ecommerce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./infra/postgres/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["sh", "/ensure-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports: ["8000:8000"]
    environment:
      SERVICE_NAME: gateway
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}  
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      REDIS_URL: redis://redis:6379/0
      TEMPLATE_URL: http://template:8000
      AUTH_URL: http://auth:8000
      USER_URL: http://user:8000
      PRODUCT_URL: http://product:8000
      INVENTORY_URL: http://inventory:8000
      CART_URL: http://cart:8000
      ORDER_URL: http://order:8000
      PAYMENT_URL: http://payment:8000
      NOTIFICATION_URL: http://notification:8000
    volumes:
      - ./.keys/gateway:/run/keys:ro
    depends_on:
      redis: { condition: service_healthy }

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./.keys/auth:/run/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      SERVICE_NAME: user-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    environment:
      SERVICE_NAME: product-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/product_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      SERVICE_NAME: inventory-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-} 
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/inventory_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    environment:
      SERVICE_NAME: cart-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_URL: http://product:8000
      INVENTORY_URL: http://inventory:8000
      USER_URL: http://user:8000
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/order_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      SERVICE_NAME: payment-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROVIDER: ${PAYMENT_PROVIDER:-fake}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      SERVICE_NAME: notification-service
      ENVIRONMENT: ${ENVIRONMENT:-local}  
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-dev-internal-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}  
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      FROM_ADDRESS: ${FROM_ADDRESS:-shop@example.com}
      SHOP_NAME: ${SHOP_NAME:-Our Shop}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  template:
    build:
      context: .
      dockerfile: services/_template/Dockerfile
    environment:
      SERVICE_NAME: template-service
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
