# Development only: expose infrastructure and services on localhost for debugging.
services:
  postgres:
    # Change POSTGRES_HOST_PORT (in .env) if another Postgres on your computer already uses 5432
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
  redis:
    ports: ["6379:6379"]
  kafka:
    ports: ["9092:9092"]
  kafka-ui:
    ports: ["8080:8080"]
  auth:
    ports: ["8001:8000"]
  user:
    ports: ["8002:8000"]
  product:
    ports: ["8003:8000"]
  inventory:
    ports: ["8004:8000"]
  cart:
    ports: ["8005:8000"]
  order:
    ports: ["8006:8000"]
  payment:
    ports: ["8007:8000"]
  notification:
    ports: ["8008:8000"]
  mailpit:
    ports: ["8025:8025", "1025:1025"]  # 8025 is the web page showing the emails
  prometheus:
    ports: ["9090:9090"]
  grafana:
    ports: ["3001:3000"]  # 3001, because a web frontend usually takes 3000
  template:
    ports: ["8100:8000"]
