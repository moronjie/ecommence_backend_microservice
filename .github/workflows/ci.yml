name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "libs/common[dev]" -r requirements-dev.txt
      - run: ruff check .
      - run: mypy libs/common/ecom_common
      - run: cd services/gateway && mypy app
      - run: cd services/auth && mypy app
      - run: cd services/user && mypy app
      - run: pytest libs/common/tests
      - run: cd services/_template && pytest
      - run: cd services/gateway && pytest
      - run: cd services/auth && pytest
      - run: cd services/user && pytest
