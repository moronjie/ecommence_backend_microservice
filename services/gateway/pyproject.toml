[project]
name = "gateway-service"
version = "0.1.0"
description = "API gateway: routing, JWT verification, rate limiting"
requires-python = ">=3.12"
dependencies = [
    "ecom-common",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
